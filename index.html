<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUST4PK - Store & Account Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#0F172A',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- HEADER / NAVBAR -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="#" class="text-2xl font-black tracking-wider text-blue-400">JUST4PK</a>
            </div>
            
            <div class="flex items-center space-x-3 sm:space-x-4">
                <!-- User Profile / Auth State -->
                <div id="userAuthSection">
                    <button onclick="openAuthModal('login')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-semibold px-3 py-2 rounded-lg flex items-center gap-2 transition">
                        <i class="fas fa-user"></i>
                        <span>Login / Sign Up</span>
                    </button>
                </div>

                <a href="https://wa.me/923091756056" target="_blank" class="bg-green-600 hover:bg-green-700 text-white text-xs sm:text-sm font-semibold px-3 py-2 rounded-lg flex items-center gap-2 transition">
                    <i class="fab fa-whatsapp text-lg"></i>
                    <span class="hidden sm:inline">Contact</span>
                </a>
            </div>
        </div>
    </header>

    <!-- HERO BANNER -->
    <section class="bg-blue-900 text-white py-10 px-4 text-center">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-3xl sm:text-5xl font-extrabold mb-3">Welcome to JUST4PK</h1>
            <p class="text-blue-200 text-sm sm:text-base">Shop premium products & place orders instantly!</p>
        </div>
    </section>

    <!-- SEARCH & CATEGORY FILTER -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 w-full">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col sm:flex-row gap-4 items-center justify-between">
            <!-- Search -->
            <div class="relative w-full sm:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fas fa-search"></i></span>
                <input type="text" id="searchInput" oninput="filterStoreProducts()" placeholder="Search products..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none">
            </div>

            <!-- Categories -->
            <div class="w-full sm:w-auto flex items-center gap-2 overflow-x-auto pb-2 sm:pb-0" id="categoryContainer">
                <button onclick="selectCategory('ALL')" class="cat-btn bg-blue-600 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-lg whitespace-nowrap transition">All Products</button>
            </div>
        </div>
    </section>

    <!-- MAIN PRODUCT GRID -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        <!-- Loading State -->
        <div id="loadingState" class="text-center py-16">
            <i class="fas fa-circle-notch fa-spin text-4xl text-blue-600 mb-3"></i>
            <p class="text-gray-500 font-medium">Fetching products...</p>
        </div>

        <!-- Products Container -->
        <div id="productGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic products load here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 bg-white rounded-xl border border-gray-200 shadow-sm">
            <i class="fas fa-box-open text-5xl text-gray-300 mb-3"></i>
            <h3 class="text-lg font-bold text-gray-700">No Products Found</h3>
            <p class="text-sm text-gray-500 mt-1">Try changing search terms or category filters.</p>
        </div>
    </main>

    <!-- CUSTOMER AUTH MODAL (LOGIN / REGISTER) -->
    <div id="authModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black bg-opacity-60 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 relative overflow-hidden">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>

            <!-- Tabs -->
            <div class="flex border-b mb-6">
                <button id="tabBtnLogin" onclick="switchAuthTab('login')" class="w-1/2 py-3 font-bold text-center border-b-2 border-blue-600 text-blue-600 text-sm">Sign In</button>
                <button id="tabBtnRegister" onclick="switchAuthTab('register')" class="w-1/2 py-3 font-semibold text-center text-gray-500 hover:text-gray-800 text-sm">Create Account</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleCustomerLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email Address</label>
                    <input type="email" id="custLoginEmail" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none" placeholder="you@example.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Password</label>
                    <input type="password" id="custLoginPass" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-md">
                    Sign In
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" onsubmit="handleCustomerRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Full Name</label>
                    <input type="text" id="custRegName" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none" placeholder="Ahmed Ali">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email Address</label>
                    <input type="email" id="custRegEmail" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none" placeholder="you@example.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Phone Number / WhatsApp</label>
                    <input type="tel" id="custRegPhone" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none" placeholder="03001234567">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Password</label>
                    <input type="password" id="custRegPass" required minlength="6" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-md">
                    Register Account
                </button>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm">
            <p>&copy; 2026 JUST4PK Store. All rights reserved.</p>
        </div>
    </footer>

    <!-- JAVASCRIPT & SUPABASE INTEGRATION -->
    <script>
        const SUPABASE_URL = "https://oqbtrppwrinmnxdclelq.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_f-x6mvz5N0sG9TE8nBw1ew_UACqpzK9";
        const WHATSAPP_NUMBER = "923091756056";

        let allProducts = [];
        let activeCategory = "ALL";
        let currentCustomer = null;

        document.addEventListener("DOMContentLoaded", () => {
            checkCustomerSession();
            fetchProductsFromDatabase();
        });

        // 1. Customer Auth Session Management
        function checkCustomerSession() {
            const saved = localStorage.getItem("just4pk_customer");
            if (saved) {
                currentCustomer = JSON.parse(saved);
                renderUserHeader();
            } else {
                currentCustomer = null;
                renderUserHeader();
            }
        }

        function renderUserHeader() {
            const container = document.getElementById("userAuthSection");
            if (currentCustomer) {
                container.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-xs sm:text-sm font-semibold text-blue-300"><i class="fas fa-user-circle"></i> ${escapeHtml(currentCustomer.name)}</span>
                        <button onclick="handleCustomerLogout()" class="text-xs bg-red-800/60 hover:bg-red-800 text-white px-2.5 py-1.5 rounded transition">Logout</button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="openAuthModal('login')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-semibold px-3 py-2 rounded-lg flex items-center gap-2 transition">
                        <i class="fas fa-user"></i>
                        <span>Login / Sign Up</span>
                    </button>
                `;
            }
        }

        function openAuthModal(tab = 'login') {
            document.getElementById("authModal").classList.remove("hidden");
            switchAuthTab(tab);
        }

        function closeAuthModal() {
            document.getElementById("authModal").classList.add("hidden");
        }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById("loginForm");
            const regForm = document.getElementById("registerForm");
            const tabBtnLogin = document.getElementById("tabBtnLogin");
            const tabBtnRegister = document.getElementById("tabBtnRegister");

            if (tab === 'login') {
                loginForm.classList.remove("hidden");
                regForm.classList.add("hidden");
                tabBtnLogin.className = "w-1/2 py-3 font-bold text-center border-b-2 border-blue-600 text-blue-600 text-sm";
                tabBtnRegister.className = "w-1/2 py-3 font-semibold text-center text-gray-500 hover:text-gray-800 text-sm";
            } else {
                loginForm.classList.add("hidden");
                regForm.classList.remove("hidden");
                tabBtnRegister.className = "w-1/2 py-3 font-bold text-center border-b-2 border-emerald-600 text-emerald-600 text-sm";
                tabBtnLogin.className = "w-1/2 py-3 font-semibold text-center text-gray-500 hover:text-gray-800 text-sm";
            }
        }

        function handleCustomerRegister(e) {
            e.preventDefault();
            const name = document.getElementById("custRegName").value.trim();
            const email = document.getElementById("custRegEmail").value.trim().toLowerCase();
            const phone = document.getElementById("custRegPhone").value.trim();

            const user = { name, email, phone };
            localStorage.setItem("just4pk_customer", JSON.stringify(user));
            currentCustomer = user;

            // Sync with admin customers list in LocalStorage
            let customersList = JSON.parse(localStorage.getItem("just4pk_customers") || "[]");
            customersList.push({ name, phone, city: "Online Customer", totalOrders: 1 });
            localStorage.setItem("just4pk_customers", JSON.stringify(customersList));

            renderUserHeader();
            closeAuthModal();
            alert(`Welcome ${name}! Your account has been created.`);
        }

        function handleCustomerLogin(e) {
            e.preventDefault();
            const email = document.getElementById("custLoginEmail").value.trim().toLowerCase();

            // Simple prototype authentication check
            const user = { name: email.split('@')[0], email, phone: "-" };
            localStorage.setItem("just4pk_customer", JSON.stringify(user));
            currentCustomer = user;

            renderUserHeader();
            closeAuthModal();
        }

        function handleCustomerLogout() {
            localStorage.removeItem("just4pk_customer");
            currentCustomer = null;
            renderUserHeader();
        }

        // 2. Fetch products from Supabase API
        async function fetchProductsFromDatabase() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&order=id.desc`, {
                    method: "GET",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                        "Content-Type": "application/json"
                    }
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                allProducts = await response.json();
                renderCategories();
                filterStoreProducts();

            } catch (err) {
                console.error("Error fetching products:", err);
                document.getElementById("loadingState").innerHTML = `
                    <div class="text-red-500 font-medium">
                        <i class="fas fa-exclamation-circle text-2xl mb-2"></i><br>
                        Unable to connect to product database.
                    </div>
                `;
            }
        }

        // 3. Render Product Cards
        function renderProducts(products) {
            const grid = document.getElementById("productGrid");
            const loading = document.getElementById("loadingState");
            const empty = document.getElementById("emptyState");

            loading.classList.add("hidden");

            if (!products || products.length === 0) {
                grid.classList.add("hidden");
                empty.classList.remove("hidden");
                return;
            }

            empty.classList.add("hidden");
            grid.classList.remove("hidden");

            grid.innerHTML = products.map(p => {
                const isOutOfStock = p.stock <= 0;
                return `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                        <div class="relative">
                            <img src="${p.image || 'https://via.placeholder.com/300?text=No+Image'}" alt="${escapeHtml(p.name)}" class="w-full h-48 object-cover">
                            <span class="absolute top-2 left-2 text-[10px] uppercase tracking-wider font-extrabold bg-slate-900/80 text-white px-2 py-0.5 rounded">
                                ${escapeHtml(p.category || 'General')}
                            </span>
                        </div>

                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-gray-800 text-base mb-1 line-clamp-1">${escapeHtml(p.name)}</h3>
                                <p class="text-xs text-gray-500 mb-3 line-clamp-2">${escapeHtml(p.description || 'No description available.')}</p>
                            </div>

                            <div class="mt-auto">
                                <div class="flex items-center justify-between mb-3">
                                    <span class="text-lg font-black text-gray-900">PKR ${parseFloat(p.price).toLocaleString()}</span>
                                    <span class="text-xs font-semibold px-2 py-0.5 rounded ${isOutOfStock ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}">
                                        ${isOutOfStock ? 'Out of Stock' : 'In Stock'}
                                    </span>
                                </div>

                                <button 
                                    onclick="orderViaWhatsapp('${escapeJsQuotes(p.name)}', ${p.price}, ${p.id})" 
                                    ${isOutOfStock ? 'disabled' : ''}
                                    class="w-full bg-green-600 hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-semibold py-2.5 rounded-lg text-sm flex items-center justify-center gap-2 transition shadow-sm">
                                    <i class="fab fa-whatsapp text-lg"></i>
                                    <span>${isOutOfStock ? 'Unavailable' : 'Order via WhatsApp'}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 4. Dynamic Categories Setup
        function renderCategories() {
            const categories = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
            const container = document.getElementById("categoryContainer");

            let html = `<button onclick="selectCategory('ALL')" id="cat-ALL" class="cat-btn bg-blue-600 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-lg whitespace-nowrap transition">All Products</button>`;
            
            categories.forEach(c => {
                html += `<button onclick="selectCategory('${escapeJsQuotes(c)}')" id="cat-${escapeJsQuotes(c)}" class="cat-btn bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs sm:text-sm font-medium px-4 py-2 rounded-lg whitespace-nowrap transition">${escapeHtml(c)}</button>`;
            });

            container.innerHTML = html;
        }

        function selectCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll(".cat-btn").forEach(btn => {
                btn.className = "cat-btn bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs sm:text-sm font-medium px-4 py-2 rounded-lg whitespace-nowrap transition";
            });

            const activeBtn = document.getElementById(`cat-${cat}`);
            if (activeBtn) {
                activeBtn.className = "cat-btn bg-blue-600 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-lg whitespace-nowrap transition";
            }

            filterStoreProducts();
        }

        // 5. Filtering (Search & Category)
        function filterStoreProducts() {
            const search = document.getElementById("searchInput").value.toLowerCase();

            const filtered = allProducts.filter(p => {
                const matchesCategory = activeCategory === "ALL" || p.category === activeCategory;
                const matchesSearch = p.name.toLowerCase().includes(search) || 
                                      (p.description && p.description.toLowerCase().includes(search));
                return matchesCategory && matchesSearch;
            });

            renderProducts(filtered);
        }

        // 6. WhatsApp Order Trigger with Customer Info Integration
        function orderViaWhatsapp(productName, price, id) {
            let customerInfoText = "";
            if (currentCustomer) {
                customerInfoText = `\n\n*Customer Details:*\nName: ${currentCustomer.name}\nEmail: ${currentCustomer.email}\nPhone: ${currentCustomer.phone}`;
            }

            const message = `Hello JUST4PK, I would like to place an order for:\n\n*Product:* ${productName}\n*Product ID:* #${id}\n*Price:* PKR ${parseFloat(price).toLocaleString()}${customerInfoText}\n\nPlease confirm availability and payment details.`;
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`, '_blank');
        }

        // Utilities
        function escapeHtml(str) {
            if (!str) return "";
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function escapeJsQuotes(str) {
            if (!str) return "";
            return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
    </script>
</body>
</html>
